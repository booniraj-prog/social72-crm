services:
  postgres:
    image: postgres:16
    container_name: social72-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: social72
      POSTGRES_PASSWORD: social72
      POSTGRES_DB: social72
    ports:
      - "5432:5432"
    volumes:
      - social72_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social72 -d social72"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: social72-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  social72_pg:
